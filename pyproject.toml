[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "fleet-protocol"
version = "0.1.0"
description = "Fleet Protocol — shared message format, wire protocol, registry, bottle async coordination, and security primitives for the SuperInstance fleet."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
fleet-cli = "fleet_protocol.cli:main"

[tool.setuptools.packages.find]
include = ["fleet_protocol*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
